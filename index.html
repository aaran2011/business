<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#ff7a1a" />
    <!--
      Under about 160 characters, or Google cuts it mid-sentence.
      EVERY CLAIM IN HERE IS CHECKED against src/data: 2-6 players,
      $25,000 each, 20 countries, up to three houses, and no payment of any
      kind anywhere in the codebase. Do not add a claim you have not read
      out of the data.
    -->
    <meta
      name="description"
      content="Play Business online with 2 to 6 players. Challenge friends in a multiplayer board game — buy countries, build houses and charge rent. Free in your browser."
    />
    <!--
      The address this page should be indexed under. It is served from two
      Vercel domains, and without this Google picks one of them itself and
      may split the page's standing across both.
    -->
    <link rel="canonical" href="https://businesss-gilt.vercel.app/" />
    <!--
      Google Search Console ownership, for businesss-gilt.vercel.app and
      business-chi-eight.vercel.app, which are two domains on one deployment.

      LEAVE THIS IN. Google re-checks ownership from time to time and silently
      drops the property if the tag has gone. It is a public token, it exposes
      nothing, and it costs one line.
    -->
    <meta name="google-site-verification" content="-mDdD6nOYegZQIjhz9RyV9p3ObOPfcWobgDirE34KFY" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Business Game Online – Play Free Multiplayer Board Game</title>

    <!--
      How the page looks when somebody shares the link. Google does not rank
      on these, but a bare link in a chat is a worse advert than a titled
      card, and people arrive at games through links from friends.

      No og:image: there is no 1200x630 picture to point at, and naming a
      file that does not exist is worse than leaving it out.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Business" />
    <meta property="og:title" content="Business Game Online – Play Free Multiplayer Board Game" />
    <meta
      property="og:description"
      content="Play Business online with 2 to 6 players. Buy countries, build houses and charge rent. Free in your browser."
    />
    <meta property="og:url" content="https://businesss-gilt.vercel.app/" />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Business Game Online – Play Free Multiplayer Board Game" />
    <meta
      name="twitter:description"
      content="Play Business online with 2 to 6 players. Buy countries, build houses and charge rent. Free in your browser."
    />

    <!--
      Structured data: what this page IS, in a form a machine can read.

      VideoGame, because it is a game that is played in software. Every field
      is checked against src/data and src/engine. There are deliberately NO
      ratings, no review counts, no download numbers, no awards and no price
      — this game has never been rated or sold, and inventing any of that is
      both a lie and a way to get structured data ignored entirely.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Business",
        "alternateName": "Business Board Game",
        "url": "https://businesss-gilt.vercel.app/",
        "description": "A board game for 2 to 6 players, played in a web browser. Move around a board of 36 spaces, buy the countries you land on, build up to three houses on them and charge rent. Play online with friends, against the computer, or by passing one device around.",
        "genre": ["Board game", "Strategy", "Multiplayer"],
        "gamePlatform": "Web browser",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any device with a web browser",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "playMode": ["MultiPlayer", "SinglePlayer"],
        "numberOfPlayers": {
          "@type": "QuantitativeValue",
          "minValue": 2,
          "maxValue": 6
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      What the page says before the app has run.

      The game is a single React root, so the HTML a crawler is handed is an
      empty div. Google does execute JavaScript, but it is not obliged to and
      it is not quick about it, so there is a plain description here for
      anything that reads the source and stops. It is also what somebody with
      JavaScript switched off would otherwise see instead of a blank page.

      Invisible to every normal visitor: a browser running the app never
      renders the contents of a noscript element.
    -->
    <noscript>
      <h1>Business — an online board game for 2 to 6 players</h1>
      <p>
        Business is a board game you play in your browser. Everyone starts
        with $25,000 and moves around a board of 36 spaces, buying the
        countries they land on, building up to three houses on them and
        charging rent to whoever lands there next.
      </p>
      <h2>Three ways to play</h2>
      <ul>
        <li>
          Online with friends: one person starts a game and shares a code,
          and everybody else joins from their own phone or laptop.
        </li>
        <li>
          Against the computer, which buys, builds, bids and goes to Jail on
          exactly the same rules as you.
        </li>
        <li>Pass and play, with everybody round one device and no connection needed.</li>
      </ul>
      <h2>Classic or bidding</h2>
      <p>
        In the classic game, landing on a country nobody owns buys it at the
        printed price. In the bidding game the whole table can bid for it,
        and the highest bid takes the card.
      </p>
      <p>This game needs JavaScript. Please switch it on and reload the page.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
